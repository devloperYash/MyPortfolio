<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D9A441" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- YL Brand Typography matching Navbar style -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Syne', 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
    <text x="11" y="42" fill="#FFFFFF">YL</text>
  </g>

  <!-- Accent Golden Dot matching navbar text-[#D9A441] -->
  <circle cx="51.5" cy="40.5" r="4.2" fill="#D9A441" filter="url(#gold-glow)"/>
</svg>